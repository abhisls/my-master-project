<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Wala Sir</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0; font-family: Arial, sans-serif; background:#080808; color:white;}
.header-nav { padding: 12px 15px; background: #0f0f0f; display: flex; align-items: center; border-bottom: 1px solid #222; position:sticky; top:0; z-index:10;}
.site-logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #222; border:2px solid #333;}
.main-content { padding: 15px; max-width: 1200px; margin:auto;}
.card{background:#141414; padding:20px; border-radius:16px; border:1px solid #222; margin-bottom:15px;}
.card h3{margin:0 0 10px 0;}
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:10px; }
.gallery img { width:100%; height:200px; object-fit:cover; border-radius:12px; }
#analystView{color:#ccc; line-height:1.5;}
</style>
</head>
<body>
<div class="header-nav">
    <img id="mainSiteLogo" class="site-logo" src="https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg" alt="Logo" />
    <h1 style="margin-left: 12px; font-size: 18px;">Camera Wala Sir</h1>
</div>

<div class="main-content">
    <!-- Description - pehle Analyst View tha -->
    <div class="card">
        <h3>Description</h3>
        <div id="analystView">Booking open</div>
    </div>

    <div class="card">
        <h3>Project Progress</h3>
        <canvas id="myChart" width="400" height="200"></canvas>
    </div>

    <div class="card">
        <h3>Gallery Photos</h3>
        <div id="galleryBox" class="gallery"></div>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
    const logo = localStorage.getItem('siteLogo');
    if(logo) document.getElementById('mainSiteLogo').src = logo;

    const desc = localStorage.getItem('analystData');
    if(desc) document.getElementById('analystView').innerText = desc;

    const photos = JSON.parse(localStorage.getItem('galleryPhotos') || '[]');
    const box = document.getElementById('galleryBox');
    box.innerHTML = photos.map(l => `<img src="${l}">`).join('');

    const chartData = JSON.parse(localStorage.getItem('chartData') || '[12, 19, 8, 15]');
    new Chart(document.getElementById('myChart'), {
        type: 'bar',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr'],
            datasets: [{ label: 'Work', data: chartData, backgroundColor: '#ff2a2a', borderRadius: 4 }]
        },
        options: { plugins:{legend:{display:false}}, scales: { x: { ticks: {color:'#888'} , grid:{display:false}}, y: { ticks: {color:'#888'}, grid:{color:'#222'} } } }
    });
});
</script>
</body>
</html>
